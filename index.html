<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Bài Bolero Trữ Tình</title>
<style>
:root{--bg:#0f0f14;--card:#1a1a22;--line:#2a2a35;--text:#eee;--muted:#999;--accent:#ff3d6e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{padding:24px 16px 8px;text-align:center}
h1{margin:0 0 4px;font-size:clamp(20px,4vw,30px);color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:14px}
.player{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:900px;margin:0 auto}
.video{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video.hide{display:none}
#yt{position:absolute;inset:0;width:100%;height:100%}
.now{text-align:center;margin:10px 0 8px;font-weight:600;min-height:20px}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;background:#2a2a35;color:#fff}
button.main{background:var(--accent);min-width:110px}
button.on{background:#3b7cff}
.tools{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
input{flex:1;min-width:180px;max-width:360px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
main{max-width:900px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.song{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.song:hover{border-color:#444}
.song.active{border-color:var(--accent);background:#2a1520}
.num{min-width:30px;height:30px;border-radius:50%;background:#2a2a35;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--accent)}
.song.active .num{background:var(--accent);color:#fff}
.name{flex:1;font-size:14px}
.src{font-size:11px;font-weight:700;color:#fff;text-decoration:none;padding:3px 6px;border-radius:6px;background:#8d22c3}
.src.n{background:#1a8cd8}
</style>
</head>
<body>
<header>
  <h1>🎵 100 Bài Bolero Trữ Tình</h1>
  <p>Bấm ▶ Phát để nghe lần lượt cả 100 bài · bấm tên bài để chuyển · Z = Zing MP3, N = NhacCuaTui</p>
</header>
<div class="player"><div class="wrap">
  <div class="video" id="vbox"><div id="yt"></div></div>
  <div class="now" id="now">Chưa phát</div>
  <div class="ctrl">
    <button id="prev">⏮</button>
    <button id="play" class="main">▶ Phát</button>
    <button id="next">⏭</button>
    <button id="shuf">🔀 Trộn bài</button>
    <button id="vid">🎬 Ẩn video</button>
  </div>
  <div class="tools"><input id="q" type="search" placeholder="Tìm tên bài hát..."></div>
</div></div>
<main id="list"></main>
<script>
const DATA = [["Ai Khổ Vì Ai", "XURrv3FOmxI"], ["Anh Tí Anh Tèo", "fneDh3LNJ7c"], ["Bạc Trắng Tình Đời", "5hUEQjy7KRQ"], ["Bao Giờ Biết Tương Tư", "AZW1rl2TWIM"], ["Bậu Vừa Lòng Chưa", "AH-o3g2jHZs"], ["Bến Sông Chờ", "PTN9aYHRawo"], ["Biển Tình", "RdmVS0Jk7Go"], ["Bội Bạc", "hm4V5WDnaoQ"], ["Bông Cỏ May", "flWw97InPi8"], ["Buồn Làm Chi Em Ơi", "roerp0dLoE0"], ["Căn Nhà Màu Tím", "VxPwx6s7Sew"], ["Căn Nhà Ngoại Ô", "snO4XwNUDag"], ["Cát Bụi Cuộc Đời", "auvvvAV2EQw"], ["Câu Chuyện Đầu Năm", "ccIOeTXePyg"], ["Cho Vừa Lòng Em", "fIlQv0Tf0nA"], ["Chút Kỷ Niệm Buồn", "MN1P7usahI4"], ["Chuyện Giàn Thiên Lý", "AU_Q3rd2KGE"], ["Chuyến Tàu Hoàng Hôn", "VGn87SE--sU"], ["Chuyện Tình Không Dĩ Vãng", "DQ7d5-6BSk0"], ["Chuyện Nàng Trinh Nữ Tên Thi", "4ni52j5XdwI"], ["Cô Hàng Xóm", "wxPPcumAiU4"], ["Cô Thắm Về Làng", "sUu53VwbfQk"], ["Cỏ Úa", "5-pYmf7Es1o"], ["Cung Đàn Có Anh", "S2Sgu25XHXY"], ["Dang Dở", "O4pBTtx21zs"], ["Đắp Mộ Cuộc Tình", "qJkv5e53tRg"], ["Đập Vỡ Cây Đàn", "X9dMxZZtzVI"], ["Đêm Buồn Tỉnh Lẻ", "Mn1VbihXmEg"], ["Đêm Tâm Sự", "sLqTRUQdddg"], ["Điệu Lý Qua Cầu", "t8m5dJqoCSw"], ["Đính Ước", "IQ13koGOHUA"], ["Đôi Mắt Người Xưa", "icOb16NSCcc"], ["Đồi Thông Hai Mộ", "kZQz1SorVzU"], ["Đời Tôi Cô Đơn", "71ebC_a2hLc"], ["Dù Anh Nghèo", "kxqLCmPX0wY"], ["Đừng Nói Xa Nhau", "5wtrRBpm7eU"], ["Đường Tình Đôi Ngả", "ML9l23my1io"], ["Duyên Kiếp", "HAEddg-Q8_Q"], ["Duyên Phận", "2kbtgdo9Jzs"], ["Em Đi Trên Cỏ Non", "cvkwgG3pLiw"], ["Gặp Nhau Làm Ngơ", "IikLzRks8RY"], ["Giã Từ", "ODZoY6anF0g"], ["Giọt Lệ Đài Trang", "sTR6xXjKNG4"], ["Giọt Nước Mắt Đàn Ông", "wLBGze6KfgQ"], ["Hát Nữa Đi Em", "B7learhYfy8"], ["Hình Bóng Quê Nhà", "a6UhO8kaYx8"], ["Hoa Cài Mái Tóc", "taZEYXJJXdc"], ["Hoa Sứ Nhà Nàng", "-iy9t4bMDHg"], ["Hoa Trinh Nữ", "GFVztgwtfLU"], ["Hồi Tưởng", "vnsVEB78K4s"], ["Không", "71on-nXwxi0"], ["Không Phải Tại Chúng Mình", "RME6TnKfJ-Q"], ["Khúc Thụy Du", "wEfAmD2msEA"], ["Khung Trời Tuổi Mộng", "lVzIDG6205A"], ["Kiếp Cầm Ca", "JZhjccdpOts"], ["Kiếp Tằm", "o7Kx0u1a6es"], ["Lá Diêu Bông", "140SDO8xzTk"], ["Lá Thư Cuối Cùng", "ItsEPjaTnaU"], ["LK Chiều Cuối Tuần", "PsCZKMRH3IE"], ["Lời Đắng Cho Cuộc Tình", "z2B52tf6gjk"], ["Mấy Nhịp Cầu Tre", "Njbb89MZaGE"], ["Ngày Xưa Anh Nói", "7wWOg7xgqU8"], ["Ngựa Ô Thương Nhớ", "Koa0Fwuwv_c"], ["Người Yêu Cô Đơn", "wzKgcGLqTL8"], ["Nhật Ký Đời Tôi", "KjyqnNFft0w"], ["Nó", "hPG4bNE1L20"], ["Nối Lại Tình Xưa", "nLPpuZ834yA"], ["Nói Với Người Tình", "-oJu5yCO7cA"], ["Nửa Vầng Trăng", "7CPlZxp5XZ4"], ["Phải Lòng Con Gái Bến Tre", "2dXZMsVnh08"], ["Phận Tơ Tằm", "ahQclCm755U"], ["Sao Không Thấy Anh Về", "JjfnlVHDaPs"], ["Sầu Đông", "HZu1Hg6UBf8"], ["Sầu Lẻ Bóng", "-nwz9UPLVk8"], ["Sầu Tím Thiệp Hồng", "RVP5N4QXHeQ"], ["Sợi Nhớ Sợi Thương", "68UWf8XD4cQ"], ["Sương Trắng Miền Quê Ngoại", "utj0ukyAXjk"], ["Tàu Về Quê Hương", "gfQpMHVpYi4"], ["Thành Phố Buồn", "3RSPtDUIngU"], ["Thói Đời", "4h30cuEYHGI"], ["Thuyền Hoa", "VcyPoI7xQ4w"], ["Tiễn Đưa", "HgH_TY8_sgk"], ["Tiền Thắng Tình Thua", "2qY0CmHZEUM"], ["Tình Đã Bay Xa", "qAjt7KIk-Js"], ["Tình Là Sợi Tơ", "ii_V3osnBdk"], ["Tình Nghèo Có Nhau", "HGJ__mvo9P8"], ["Tình Thắm Duyên Quê", "xC4aEw9-ZzU"], ["Tình Xưa Nghĩa Cũ", "NhR2pKpdwKc"], ["Tình Yêu Trên Dòng Sông Quan Họ", "oh9AJzjHN1c"], ["Trách Ai Bây Giờ", "oG9cuN2PYEo"], ["Trách Ai Vô Tình", "2NIfFOIEb4M"], ["Tương Tư Nàng Ca Sĩ", "hxlSBZO78R0"], ["Tùy Hứng Lý Qua Cầu", "suXlbOY4A94"], ["Về Đâu Mái Tóc Người Thương", "B2w0-cw-6Uw"], ["Vì Lỡ Thương Nhau", "WTNsgGEljaM"], ["Vọng Cổ Tình Xuân", "2yhlhz9gjNg"], ["Vui Tết Miệt Vườn", "sAIVYLNAGPU"], ["Vùng Lá Me Bay", "z8DLkLnemFY"], ["Yêu Một Mình", "1PzQEt_Yops"], ["Yêu Thương Đã Nhạt Nhòa", "WQx_dgKBMlI"]];
let order = DATA.map((_,i)=>i), pos = -1, player, ready=false, shuffle=false, playing=false;
const list=document.getElementById('list'), now=document.getElementById('now'), playBtn=document.getElementById('play');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
DATA.forEach(([name],i)=>{const el=document.createElement('div');el.className='song';el.id='s'+i;
  el.innerHTML=`<div class="num">${i+1}</div><div class="name">${name}</div><a class="src" target="_blank" title="Zing MP3" href="https://zingmp3.vn/tim-kiem/tat-ca?q=${encodeURIComponent(name)}">Z</a><a class="src n" target="_blank" title="NhacCuaTui" href="https://www.nhaccuatui.com/tim-kiem?q=${encodeURIComponent(name)}">N</a>`;
  el.querySelectorAll('a').forEach(a=>a.onclick=e=>e.stopPropagation());
  el.onclick=()=>{pos=order.indexOf(i);load();};list.appendChild(el);});
document.getElementById('q').oninput=e=>{const f=norm(e.target.value.trim());
  DATA.forEach(([n],i)=>document.getElementById('s'+i).style.display=(!f||norm(n).includes(f))?'':'none');};
function cur(){return order[pos];}
function load(){ if(!ready) return; const i=cur(); player.loadVideoById(DATA[i][1]);
  document.querySelectorAll('.song.active').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('s'+i); el.classList.add('active'); el.scrollIntoView({block:'nearest',behavior:'smooth'});
  now.textContent=`Đang phát ${i+1}. ${DATA[i][0]}`; document.title=`▶ ${DATA[i][0]}`; }
function next(){pos=(pos+1)%order.length;load();}
function prev(){pos=(pos-1+order.length)%order.length;load();}
playBtn.onclick=()=>{ if(!ready) return; if(pos<0){pos=0;load();return;} playing?player.pauseVideo():player.playVideo(); };
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('shuf').onclick=e=>{shuffle=!shuffle;e.target.classList.toggle('on',shuffle);
  const c=pos>=0?cur():null; order=DATA.map((_,i)=>i);
  if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
  if(c!==null) pos=order.indexOf(c);};
document.getElementById('vid').onclick=e=>{const v=document.getElementById('vbox');v.classList.toggle('hide');
  e.target.textContent=v.classList.contains('hide')?'🎬 Hiện video':'🎬 Ẩn video';};
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{videoId:DATA[0][1],playerVars:{playsinline:1,rel:0},
    events:{onReady:()=>{ready=true;},
      onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED) next();
        playing = e.data===YT.PlayerState.PLAYING;
        playBtn.textContent = playing?'⏸ Dừng':'▶ Phát';
        if(e.data===YT.PlayerState.PLAYING && pos<0){pos=0;load();} },
      onError:()=>setTimeout(next,800)}});
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
